<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap To‑Do List</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: linear-gradient(135deg, #f8cdda, #fbc7d4);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(255, 105, 180, 0.3);
    }
    .glow-btn {
      box-shadow: 0 0 15px #ff69b4;
      transition: 0.3s;
    }
    .glow-btn:hover {
      box-shadow: 0 0 25px #ff1493;
    }
    .completed {
      text-decoration: line-through;
      color: #ff69b4;
      font-style: italic;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

  <div class="glass-card p-4 text-center" style="width: 350px;">
    <h2 class="mb-3" style="color:#ff69b4;">✨ My Tasks ✨</h2>
    <div class="input-group mb-3">
      <input type="text" id="taskInput" class="form-control" placeholder="Enter a task...">
      <button id="addBtn" type="button" class="btn glow-btn" style="background:#ff69b4; color:white;">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>

    
    <ul id="taskList" class="list-group mb-3"></ul>
    <div class="d-flex justify-content-between">
      <button id="undoBtn" type="button" class="btn btn-outline-secondary me-2" disabled>
        <i class="bi bi-arrow-counterclockwise"></i> Undo
      </button>
      <button id="clearBtn" type="button" class="btn btn-outline-danger">
        <i class="bi bi-x-circle"></i> Clear All
      </button>
    </div>
    <button id="toggleBtn" type="button" class="btn btn-light position-fixed top-0 end-0 m-3">
  <i class="bi bi-moon-fill"></i>
</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
